server_endpoint = "/run/user/1000/clipcat/grpc.sock"
finder = "rofi"
preview_length = 100
grpc_max_message_size = 8388608

[rofi]
line_length = 120
menu_length = 25
menu_prompt = "Clipboard"
extra_arguments = ["-theme-str", "window {width: 55%;}"]
show_source_prefix = false

[log]
emit_journald = false
emit_stdout = false
emit_stderr = false
level = "WARN"
